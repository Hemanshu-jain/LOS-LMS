name: Deploy to Render

# Every push to main (code, not docs) tells Render to build and deploy the Docker image.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# One deploy request at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        # The hook URL is a secret: it is only ever read from the environment, never printed.
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null -w "Render deploy triggered: HTTP %{http_code}\n"
