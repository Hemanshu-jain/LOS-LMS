name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    # LosLms.Server and LosLms.Shell target net8.0-windows (WinForms + WebView2), so the solution only
    # builds on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # --locked-mode makes restore fail if any lockfile is out of date with the csproj, so a dependency
      # change that wasn't committed with its lockfile is caught here rather than drifting silently.
      - name: Restore (locked)
        run: dotnet restore LosLms.sln --locked-mode

      - name: Build
        run: dotnet build LosLms.sln --no-restore -c Release

      # dotnet list --vulnerable prints advisories but always exits 0, so fail the job ourselves if the
      # output names any vulnerable package.
      - name: Scan dependencies for known vulnerabilities
        shell: pwsh
        run: |
          $out = dotnet list LosLms.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') {
            Write-Error 'Vulnerable NuGet packages found. See the list above.'
            exit 1
          }

      - name: Test
        run: dotnet test LosLms.sln --no-build -c Release --verbosity normal
